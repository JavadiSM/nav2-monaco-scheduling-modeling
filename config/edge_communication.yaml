enabled: false
transport: ros2_dds
link_model: application_level_emulation
defaults:
  publish_rate_hz: null
  latency_ms: 0.0
  bandwidth_mbps: null
  packet_loss_probability: null
  coverage_radius_m: 5.0
  communication_cost_s: 0.0
cost_assumption: User-selected ideal zero-cost link inside the 5 m radius; not a physical
  latency measurement.
coverage_check: request_send_only
result_delivery: admitted_request_no_distance_recheck
cost_interface: keyword_arguments_return_nonnegative_seconds
